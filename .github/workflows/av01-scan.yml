name: AV01 scan 20
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan until 20 valid AV01 movies
        run: node scripts/av01-scan.mjs 20
      - name: Save scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/av01-progress.json data/av01-catalog.json
          git diff --cached --quiet || git commit -m "data(av01): update scanned 1080p catalog"
          git push
